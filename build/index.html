<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Convexify | Live convex decomposition for Unity</title>
    <meta name="description" content="Drop in a mesh and watch V-HACD convex decomposition update live as you change the settings. Built with Convexify for Unity.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://doji-tech.com/convexify-demo/">
    <meta property="og:title" content="Convexify | Live convex decomposition for Unity">
    <meta property="og:description" content="Drop in a mesh and watch V-HACD convex decomposition update live as you change the settings. Built with Convexify for Unity.">
    <meta property="og:image" content="https://doji-tech.com/convexify-demo/social-preview.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A colorful convex decomposition of a teapot in the Convexify web demo.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Convexify | Live convex decomposition for Unity">
    <meta name="twitter:description" content="Drop in a mesh and watch V-HACD convex decomposition update live as you change the settings. Built with Convexify for Unity.">
    <meta name="twitter:image" content="https://doji-tech.com/convexify-demo/social-preview.jpg">
    <meta name="twitter:image:alt" content="A colorful convex decomposition of a teapot in the Convexify web demo.">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loader">
        <div class="mark"></div>
        <div class="title">Convexify</div>
        <div class="progress"><div id="progress-fill"></div></div>
      </div>
      <div id="drop-overlay">Drop a .obj file to decompose it</div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loader = document.querySelector("#loader");
      var progressFill = document.querySelector("#progress-fill");
      var dropOverlay = document.querySelector("#drop-overlay");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.textContent = msg;
        if (type) div.className = type;
        warningBanner.appendChild(div);
        if (type != 'error') {
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/build.data",
        frameworkUrl: buildUrl + "/build.framework.js",
        codeUrl: buildUrl + "/build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Doji Technologies",
        productName: "convexify-demo",
        productVersion: "1.0.0",
        showBanner: unityShowBanner,
      };

      // Sends a dropped .obj file to the demo (DemoApp.OnFileSelected on the GameObject "App").
      function sendFile(unityInstance, file) {
        var extension = file.name.split('.').pop().toLowerCase();
        if (extension !== "obj") {
          unityShowBanner("Only .obj files are supported (got ." + extension + ")", "warning");
          return;
        }
        var fileInfo = {
          url: URL.createObjectURL(file),
          fileName: file.name,
          size: String(file.size)
        };
        unityInstance.SendMessage("App", "OnFileSelected", JSON.stringify(fileInfo));
      }

      function enableDragAndDrop(unityInstance) {
        var depth = 0;
        container.addEventListener('dragenter', function (event) {
          event.preventDefault();
          depth++;
          dropOverlay.classList.add('visible');
        });
        container.addEventListener('dragleave', function () {
          depth = Math.max(0, depth - 1);
          if (depth === 0) dropOverlay.classList.remove('visible');
        });
        container.addEventListener('dragover', function (event) {
          event.preventDefault();
        });
        container.addEventListener('drop', function (event) {
          event.preventDefault();
          depth = 0;
          dropOverlay.classList.remove('visible');
          var files = event.dataTransfer.files;
          if (files.length > 0) sendFile(unityInstance, files[0]);
        });
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressFill.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loader.classList.add('hidden');
          enableDragAndDrop(unityInstance);
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
